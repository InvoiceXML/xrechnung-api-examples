<!DOCTYPE html>
<meta charset="utf-8">
<title>Create XRechnung with InvoiceXML API</title>
<!--
  Get API key: https://www.invoicexml.com/account/authentication
  Docs:        https://www.invoicexml.com/docs/api/create/xrechnung

  WARNING: do not ship API keys in production browser code. Anyone who
  views the page source can read and reuse your key. For production,
  proxy this request through your own backend so the key stays server-side.
-->

<h1>Create XRechnung invoice</h1>
<button id="run">Generate invoice</button>
<p id="status"></p>

<script>
// Raw key only, without the "Bearer " prefix (it is added below).
const apiKey = 'YOUR_API_KEY';

const payload = {
    invoice: {
        invoiceNumber: 'XR-2026-001',
        issueDate:     '2026-05-18',
        currency:      'EUR',
        // The Leitweg-ID (BT-10), required for German B2G invoicing.
        buyerReference: '991-12345-67',
        seller: {
            name:              'Acme GmbH',
            vatIdentifier:     'DE123456789',
            legalRegistration: { identifier: 'HRB 12345' },
            postalAddress: {
                line1:    'Hauptstraße 12',
                city:     'Berlin',
                postCode: '10115',
                country:  'DE',
            },
            // XRechnung requires the seller contact group and an electronic address.
            contact: {
                name:  'Max Mustermann',
                phone: '+49 30 12345678',
                email: 'billing@acme.de',
            },
            electronicAddress: { identifier: 'DE123456789', schemeId: '9930' },
        },
        buyer: {
            name: 'Bundesamt für Musterverwaltung',
            postalAddress: {
                line1:    'Behördenstraße 5',
                city:     'Bonn',
                postCode: '53113',
                country:  'DE',
            },
            electronicAddress: { identifier: '991-12345-67', schemeId: '0204' },
        },
        paymentDetails: { paymentAccountIdentifier: 'DE89370400440532013000' },
        lines: [
            {
                quantity:       10,
                priceDetails:   { netPrice: 150.00 },
                vatInformation: { rate: 19.00 },
                item:           { name: 'Senior consulting' },
            },
        ],
    },
    options: { version: '3.0' },
};

document.getElementById('run').addEventListener('click', async () => {
    const status = document.getElementById('status');
    status.textContent = 'Generating...';

    const response = await fetch('https://api.invoicexml.com/v1/create/xrechnung', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            Authorization: 'Bearer ' + apiKey,
        },
        body: JSON.stringify(payload),
    });

    if (!response.ok) {
        status.textContent = `InvoiceXML API error ${response.status}: ${await response.text()}`;
        return;
    }

    const xml = await response.text();
    const blob = new Blob([xml], { type: 'application/xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'invoice-xrechnung.xml';
    a.click();
    status.textContent = `Downloaded invoice-xrechnung.xml (${xml.length} chars)`;
});
</script>
